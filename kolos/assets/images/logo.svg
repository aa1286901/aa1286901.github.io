<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A855"/>
      <stop offset="100%" style="stop-color:#C69A5A"/>
    </linearGradient>
  </defs>
  <!-- Circular background -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <!-- Wheat stalks -->
  <g transform="translate(40, 30)">
    <!-- Main stalk -->
    <path d="M60 170 Q55 120 65 70 Q70 40 60 10" stroke="url(#gold)" fill="none" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left grains -->
    <ellipse cx="42" cy="25" rx="8" ry="14" transform="rotate(-25 42 25)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="48" cy="45" rx="8" ry="14" transform="rotate(-20 48 45)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="47" cy="65" rx="7" ry="12" transform="rotate(-15 47 65)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="46" cy="83" rx="7" ry="12" transform="rotate(-10 46 83)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="48" cy="100" rx="6" ry="11" transform="rotate(-5 48 100)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <!-- Right grains -->
    <ellipse cx="78" cy="20" rx="8" ry="14" transform="rotate(25 78 20)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="72" cy="40" rx="8" ry="14" transform="rotate(20 72 40)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="73" cy="60" rx="7" ry="12" transform="rotate(15 73 60)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="74" cy="78" rx="7" ry="12" transform="rotate(10 74 78)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="72" cy="95" rx="6" ry="11" transform="rotate(5 72 95)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <!-- Leaf -->
    <path d="M60 130 Q40 140 30 160 Q45 155 60 145" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
  </g>
  <!-- Second smaller stalk -->
  <g transform="translate(80, 50) scale(0.7)" opacity="0.8">
    <path d="M60 170 Q55 120 65 70 Q70 40 60 10" stroke="url(#gold)" fill="none" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="42" cy="25" rx="8" ry="14" transform="rotate(-25 42 25)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="48" cy="45" rx="8" ry="14" transform="rotate(-20 48 45)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="47" cy="65" rx="7" ry="12" transform="rotate(-15 47 65)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="46" cy="83" rx="7" ry="12" transform="rotate(-10 46 83)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="48" cy="100" rx="6" ry="11" transform="rotate(-5 48 100)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="78" cy="20" rx="8" ry="14" transform="rotate(25 78 20)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="72" cy="40" rx="8" ry="14" transform="rotate(20 72 40)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="73" cy="60" rx="7" ry="12" transform="rotate(15 73 60)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="74" cy="78" rx="7" ry="12" transform="rotate(10 74 78)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
    <ellipse cx="72" cy="95" rx="6" ry="11" transform="rotate(5 72 95)" stroke="url(#gold)" fill="none" stroke-width="1.5"/>
  </g>
  <!-- Circular arc elements -->
  <path d="M30 120 Q30 60 80 40" stroke="url(#gold)" fill="none" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 140 Q30 70 85 50" stroke="url(#gold)" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
