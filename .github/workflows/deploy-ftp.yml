name: Deploy Fasad to hosting

# Каждый push в master (в том числе после слияния PR) загружает папку fasad/
# на хостинг по FTP. Нужны секреты репозитория: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.

on:
  push:
    branches: [master]
    paths: ["fasad/**", ".github/workflows/deploy-ftp.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Версия в ссылках на css/js и в кэше приложения = номер коммита:
      # после каждого деплоя телефон скачивает новые файлы, а не берёт старые из кэша
      - name: Stamp asset version
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s/\?v=[A-Za-z0-9]+\"/?v=$V\"/g" fasad/index.html
          sed -i -E "s/const CACHE_NAME = '[^']*'/const CACHE_NAME = 'fasad-$V'/" fasad/sw.js
          grep -c "?v=$V" fasad/index.html
          grep "CACHE_NAME =" fasad/sw.js
      - name: Upload fasad/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: fasad/
          server-dir: /ahmedov.online/fasad/
          # Живые данные на хостинге не перезаписываем: база пользователей и загруженные фото
          exclude: |
            **/.git*
            data/database.json
            data/db.php
            data/ai.php
            data/ai-log.php
            data/ai-log.php.lock
            data/db.php.tmp
            data/db.lock
            uploads/originals/**
            uploads/generated/**
