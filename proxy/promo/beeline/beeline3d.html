<script type="module">

const R=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(1080,1920,false);R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;R.outputColorSpace=THREE.SRGBColorSpace;

scene.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),.04).texture;
const cam=new THREE.PerspectiveCamera(32,1080/1920,.1,100);cam.position.set(0,0,9);
// stripe texture
const tc=document.createElement('canvas');tc.width=1024;tc.height=512;const g=tc.getContext('2d');
g.fillStyle='#FFC400';g.fillRect(0,0,1024,512);
const bands=[[.10,.17],[.29,.37],[.49,.57],[.69,.77],[.86,.92]];
g.fillStyle='#0d0d0d';for(const [a,b] of bands){g.beginPath();g.moveTo(0,a*512);for(let x=0;x<=1024;x+=16)g.lineTo(x,a*512+Math.sin(x/1024*Math.PI*2)*14);for(let x=1024;x>=0;x-=16)g.lineTo(x,b*512+Math.sin(x/1024*Math.PI*2)*14);g.fill()}
const tex=new THREE.CanvasTexture(tc);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
const ball=new THREE.Mesh(new THREE.SphereGeometry(1,128,96),new THREE.MeshPhysicalMaterial({map:tex,roughness:.28,metalness:0,clearcoat:1,clearcoatRoughness:.08,envMapIntensity:1.1}));
const pivot=new THREE.Group();pivot.add(ball);scene.add(pivot);ball.rotation.z=-.42;
const key=new THREE.DirectionalLight(0xfff1d0,2.6);key.position.set(-3,4,5);scene.add(key);
const rim=new THREE.DirectionalLight(0xffc040,3.2);rim.position.set(4,-1,-3);scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff,.25));
// particles
const NP=420,pg=new THREE.BufferGeometry(),pos=new Float32Array(NP*3),seed=[];
for(let i=0;i<NP;i++){seed.push([rnd(i)*2-1,rnd(i+1e3)*2-1,rnd(i+2e3)*2-1,rnd(i+3e3)])}
pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const sc=document.createElement('canvas');sc.width=sc.height=64;const sg=sc.getContext('2d');const gr=sg.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,240,180,1)');gr.addColorStop(.3,'rgba(255,200,0,.6)');gr.addColorStop(1,'rgba(255,200,0,0)');sg.fillStyle=gr;sg.fillRect(0,0,64,64);
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.09,map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(pts);

/* ---------- text helpers ---------- */
function split(el){const t=el.textContent;el.textContent='';return [...t].map(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c;el.appendChild(s);return s})}
const L={};['a1','a2','a3','perm','b1','b2','b3','c1','c2'].forEach(id=>L[id]=split($(id)));

document.querySelectorAll('.gold .ch, .ch').forEach(s=>{if(s.parentElement.classList.contains('gold')){s.classList.add('gold')}});
function reveal(arr,t,a,st=.028,d=.55){arr.forEach((s,i)=>{const q=pr(t,a+i*st,a+d+i*st);s.style.transform=`translateY(${(1-eo5(q))*110}%) rotate(${(1-eo(q))*8}deg)`;s.style.opacity=q>0?Math.min(1,q*2.5):0;s.style.filter=q<1?`blur(${(1-q)*10}px)`:'none'})}

/* S3 cards */
const CARDS=[{t:'Безлимитный интернет',s:'+ раздача Wi-Fi',i:'inf'},{t:'Звонки на Билайн',s:'без ограничений',i:'inf'},{t:'Другие операторы',s:'≈ 3,5 ₽ / минута',i:'rub'}];
const INF='<svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="#1a1400" stroke-width="2.8" stroke-linecap="round"><path d="M12 12c-2-2.7-3.6-4-5.5-4a4 4 0 0 0 0 8c1.9 0 3.5-1.3 5.5-4zm0 0c2 2.7 3.6 4 5.5 4a4 4 0 0 0 0-8c-1.9 0-3.5 1.3-5.5 4z"/></svg>';
$('s3').innerHTML=CARDS.map((c,k)=>`<div id="cd${k}" class="abs card glass" style="left:100px;top:${720+k*250}px"><div class="ic">${c.i==='inf'?INF:'<span class="U" style="font-size:66px;color:#1a1400">₽</span>'}</div><div><div class="ct">${c.t}</div><div class="cs">${c.s}</div></div></div>`).join('')+
 `<div class="abs cx" style="top:560px"><div class="line"><div id="h3" class="U" style="font-size:64px">Что входит</div></div></div>`;
L.h3=split($('h3'));
/* S4 months */
const MON=['ЯНВ','ФЕВ','МАР','АПР','МАЙ','ИЮН','ИЮЛ','АВГ','СЕН','ОКТ','НОЯ','ДЕК'];
$('months').innerHTML=MON.map((m,k)=>`<div class="abs mon glass" id="mo${k}" style="left:${k*175}px;top:20px"><div class="M" style="font-size:28px;color:#C9C2AE;letter-spacing:.1em">${m}</div><div class="U gold" style="font-size:52px">0 ₽</div><svg class="ok" width="40" height="40" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2BD96B"/><path d="m7 12.5 3.2 3.2L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`).join('');

/* ---------- timeline ---------- */
const S={s1:0,s2:3.6,s3:6.7,s4:10.9,s5:14.4,end:18.0};
const SFX=[['riser',0],['beam',.25],['boom',.85],['whoosh',S.s2-.25],['impact',S.s2+.15],['shimmer',S.s2+.9],
 ['whoosh',S.s3-.2],['glass',S.s3+.35],['glass',S.s3+.8],['glass',S.s3+1.25],['whoosh',S.s4-.2],['coin',S.s4+.5],
 ...MON.map((m,k)=>['tick',+(S.s4+1.6+k*.09).toFixed(3)]),['chime',S.s4+2.8],['whoosh',S.s5-.2],['alert',S.s5+.25],['alert',S.s5+.85],['pop',S.s5+1.6],['shimmer',S.s5+2.3],['ding',S.end-.6]];
window.TIMING={sfx:SFX,end:S.end};

function vis(id,t,a,b){const e=$(id);const on=t>=a-.05&&t<b+.45;e.style.display=on?'block':'none';return on}

function render(t){
  /* background */
  const rp=eo(pr(t,.6,1.6));$('rays').style.opacity=rp*.9;$('rays').style.transform=`rotate(${t*8}deg) scale(${lerp(.6,1,rp)})`;
  /* sphere path */
  let y=0,s=1,x=0;
  const rise=eo5(pr(t,.6,1.6));
  if(t<S.s2){y=lerp(-6,.85,rise);s=lerp(.5,1.05,rise)}
  else if(t<S.s3){const k=eio(pr(t,S.s2,S.s2+.6));y=lerp(.85,1.45,k);s=lerp(1.05,.62,k)}
  else if(t<S.s4){const k=eio(pr(t,S.s3,S.s3+.6));y=lerp(1.45,1.62,k);s=lerp(.62,.45,k)}
  else if(t<S.s5){y=1.62;s=.45}
  else{const k=eio(pr(t,S.s5,S.s5+.6));y=lerp(1.62,1.6,k);s=lerp(.45,.52,k)}
  y+=Math.sin(t*1.6)*.05;
  pivot.position.set(x,y,0);pivot.scale.setScalar(s);
  ball.rotation.y=t*1.15+(1-rise)*-6;ball.rotation.x=Math.sin(t*.7)*.15;
  // particles: drift + burst at 0₽
  const burst=pr(t,S.s2+.15,S.s2+1.6);
  for(let i=0;i<NP;i++){const [a,b,c,d]=seed[i];const r=3+d*3;
    let px=a*4.2,py=b*7.5+((t*.18*(0.5+d))%2-1)*.8,pz=c*2-1;
    if(burst>0&&i<160){const ang=i/160*Math.PI*2;const rr=eo(burst)*(2+d*3);px=Math.cos(ang)*rr*.9;py=-0.35+Math.sin(ang)*rr*.9;}
    pos[i*3]=px;pos[i*3+1]=py;pos[i*3+2]=pz}
  pg.attributes.position.needsUpdate=true;pts.material.opacity=lerp(0,1,pr(t,.8,1.6))*(burst>0&&burst<1?1:.75);
  R.render(scene,cam);
  // glow follows sphere (project)
  const v=new THREE.Vector3(x,y,0).project(cam);const gx=(v.x+1)/2*1080,gy=(1-v.y)/2*1920;
  $('glow').style.left=gx-450+'px';$('glow').style.top=gy-450+'px';$('glow').style.opacity=rise*(.75+.25*Math.sin(t*3));$('glow').style.transform=`scale(${s/1.25})`;
  $('gl').style.filter=(t>S.s3+.3&&t<S.s4+.2)?`blur(${eo(pr(t,S.s3+.3,S.s3+.8))*(1-pr(t,S.s4-.2,S.s4+.2))*6}px)`:'none';
  /* intro beam */
  const bw=eo(pr(t,.2,.75)),bo=1-pr(t,.8,1.1);$('beam').style.width=bw*1080+'px';$('beam').style.marginLeft=-bw*540+'px';$('beam').style.opacity=bo;
  $('brand').style.opacity=pr(t,1.2,1.7)*(1-pr(t,S.s2-.3,S.s2));
  /* S1 */
  if(vis('s1',t,0,S.s2)){reveal(L.a1,t,1.55);reveal(L.a2,t,1.85);reveal(L.a3,t,2.2,.03);hide([...L.a1,...L.a2,...L.a3],t,S.s2-.4)}

    $('zt').style.backgroundPosition=`${lerp(100,0,eio(pr(t,S.s2+.85,S.s2+1.7)))}% 0`;
    reveal(L.perm,t,S.s2+.5,.04);
    [['ring1',0],['ring2',.12]].forEach(([id,dl])=>{const q=pr(t,S.s2+.15+dl,S.s2+1.2+dl);const e=$(id);const r=eo(q)*900;e.style.width=e.style.height=r+'px';e.style.marginLeft=e.style.marginTop=-r/2+'px';e.style.opacity=q>0?1-q:0});
    const o=pr(t,S.s3-.4,S.s3);Z.style.opacity=Math.min(+Z.style.opacity,1-o);Z.style.transform+=` translateY(${-o*120}px)`;hide(L.perm,t,S.s3-.4)}
  /* S3 */
  if(vis('s3',t,S.s3,S.s4)){reveal(L.h3,t,S.s3+.05,.03);CARDS.forEach((c,k)=>{const a=S.s3+.3+k*.45;const q=pr(t,a,a+.6);const e=$('cd'+k);
      e.style.opacity=q>0?Math.min(1,q*2):0;e.style.transform=`rotateX(${(1-eb(q,1.3))*-75}deg) translateY(${(1-eo(q))*120}px) translateZ(${(1-eo(q))*-200}px) rotateY(${Math.sin(t*1.2+k)*3}deg)`;
      const o=pr(t,S.s4-.45+k*.05,S.s4-.1+k*.05);if(o>0){e.style.opacity=1-o;e.style.transform+=` translateX(${(k%2?1:-1)*eio(o)*500}px)`}});hide(L.h3,t,S.s4-.4)}
