<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Фонд Сагасидейбук</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: один телефон по центру, минимализм — белый фон, тонкие линии, один зелёный акцент */
:root{
  --page:#F1F3F2; --bg:#FFFFFF; --soft:#F5F7F6; --ink:#111814; --muted:#7A847F; --line:#ECEFED;
  --accent:#137A4B; --on-accent:#FFFFFF; --track:#E9EEEB; --minus:#B0442E; --frame:#111111;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#050706; --bg:#0E1210; --soft:#161B18; --ink:#EDF1EE; --muted:#87918C; --line:#1E2522;
  --accent:#3DBB7E; --on-accent:#04140B; --track:#222A26; --minus:#E58068; --frame:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#050706; --bg:#0E1210; --soft:#161B18; --ink:#EDF1EE; --muted:#87918C; --line:#1E2522;
  --accent:#3DBB7E; --on-accent:#04140B; --track:#222A26; --minus:#E58068; --frame:#000000; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 32px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.n{font-variant-numeric:tabular-nums}

.phone{width:100%;max-width:390px;height:min(800px,calc(100svh - 56px));min-height:620px;margin:0 auto;border-radius:48px;background:var(--frame);padding:10px}
@media (max-width:440px){.phone{border-radius:34px;padding:6px}}
.screen{position:relative;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
@media (max-width:440px){.screen{border-radius:28px}}
.status{flex:none;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-weight:700;font-size:14px}
.status i{width:90px;height:24px;border-radius:20px;background:var(--frame)}
.view{flex:1;overflow-y:auto;scrollbar-width:none;padding:4px 20px 24px}
.view::-webkit-scrollbar{display:none}

.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:8px 0 20px}
.tabs button{text-align:center;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:3px}
.tabs svg{width:22px;height:22px}
.tabs [aria-current]{color:var(--ink)}

.brand{font-size:13px;font-weight:700;color:var(--muted);padding:6px 0 18px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 18px}
.label{font-size:13px;color:var(--muted)}
.total{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:2px 0 16px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;text-align:center}
.h2{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 4px}
.h2 b{font-size:17px;font-weight:800}
.h2 span{font-size:13px;color:var(--muted)}

.item{display:block;width:100%;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:0}
.item .t{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:15px}
.item .t em{font-style:normal;color:var(--accent);font-weight:800}
.bar{height:4px;border-radius:4px;background:var(--track);margin:10px 0 7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.item .s{font-size:13px;color:var(--muted)}
.item .s b{color:var(--ink);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:.02em}

.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row span{min-width:0}
.row small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.row b{white-space:nowrap;font-weight:700}
.minus{color:var(--minus)} .plus{color:var(--accent)}

.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--muted);font-size:14px;padding:6px 0 14px}
.back svg{width:18px;height:18px}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.p{color:var(--muted);font-size:14.5px;margin:16px 0 0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 18px;border-block:1px solid var(--line)}
.facts div{padding:12px 0;font-size:12px;color:var(--muted)}
.facts b{display:block;font-size:16px;color:var(--ink)}

.month{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 14px}
.month b{font-size:15px}
.month button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft)}
.month button:disabled{opacity:.3;cursor:default}
.month svg{width:18px;height:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--soft);border-radius:12px;padding:12px;font-size:12px;color:var(--muted)}
.kpis b{display:block;font-size:15px;margin-top:2px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 20px 28px;z-index:6;transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sheet h3{margin:0;font-size:19px;font-weight:800}
.sheet .to{font-size:13px;color:var(--muted);margin:2px 0 16px}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.amts button,.seg button{height:42px;border-radius:10px;background:var(--soft);font-weight:700;font-size:14px;text-align:center}
.amts [aria-pressed="true"],.seg [aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.inp{display:flex;align-items:center;height:46px;border-radius:10px;background:var(--soft);padding:0 14px;margin-top:6px}
.inp input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;font-weight:700;color:var(--ink)}
.inp input:focus{outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 18px}
.ok{text-align:center;padding:8px 0 4px}
.ok .c{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.ok .c svg{width:28px;height:28px}
.ok p{color:var(--muted);font-size:14px;margin:6px 0 20px}
.cap{text-align:center;font-size:12.5px;color:var(--muted);margin:14px 0 0}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
</style>

<div class="phone">
  <div class="screen">
    <div class="status"><span class="n">9:41</span><i></i><span class="n">100%</span></div>
    <div class="view" id="view"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Пожертвование"></div>
  </div>
</div>
<p class="cap">Макет · все суммы и даты примерные</p>

<script>
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  news:'<path d="M4 10v4a1 1 0 0 0 1 1h3l6 4V5L8 9H5a1 1 0 0 0-1 1z"/><path d="M18 9a4 4 0 0 1 0 6"/>',
  back:'<path d="m15 6-6 6 6 6"/>', next:'<path d="m9 6 6 6-6 6"/>', check:'<path d="m5 12 5 5L20 7"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const rub = n => n.toLocaleString('ru-RU') + ' ₽';
const pct = c => Math.round(c.raised / c.goal * 100);

const CAMPS = [
  {id:'need', tag:'В первую очередь', title:'Помощь нуждающимся', raised:184500, goal:300000, donors:96, left:'постоянно',
   text:'Продукты, лекарства и лечение для семей селения. Имена семей не публикуются.',
   spent:[['Продуктовые наборы, 12 семей','25 окт',54000],['Лечение, 2 семьи','18 окт',38500]]},
  {id:'mosque', title:'Достройка мечети', raised:2160000, goal:3000000, donors:428, left:'38 дней',
   text:'Утепление, внутренняя отделка и отопление к зиме.',
   spent:[['Гипсокартон и профиль','10 окт',120000],['Цемент, 60 мешков','5 окт',90000]]},
  {id:'madrasa', title:'Классы медресе', raised:900000, goal:2000000, donors:211, left:'60 дней',
   text:'Пристройка двух классов, парты и учебники.',
   spent:[['Кирпич, 4 поддона','2 окт',64000]]},
  {id:'gaza', title:'Помощь Газе', raised:412000, goal:1000000, donors:305, left:'14 дней',
   text:'Продукты и медикаменты через проверенный фонд-партнёр. Подтверждение перевода — в отчёте.',
   spent:[['Перевод фонду-партнёру','20 окт',150000]]},
  {id:'road', title:'Дорога к кладбищу', raised:145000, goal:450000, donors:58, left:'45 дней',
   text:'Отсыпка щебнем 600 метров и водоотвод.',
   spent:[['Щебень, 3 КамАЗа','27 окт',36000]]}
];
const REPORTS = {
  'Октябрь 2026':{online:214300, boxes:96850, cash:40000, balance:1240600,
    out:[['Мечеть','Гипсокартон, цемент',210000],['Газа','Перевод фонду-партнёру',150000],['Нуждающимся','14 семей',92500],['Медресе','Кирпич',64000],['Дорога','Щебень',36000]]},
  'Сентябрь 2026':{online:181200, boxes:88400, cash:28400, balance:1287750,
    out:[['Мечеть','Купол, кровля',240000],['Нуждающимся','11 семей',47000],['Селение','Вывоз мусора',23000]]}
};
const BOXES = [['Джума-мечеть','7 ноя',38450],['Магазин «Нур»','7 ноя',12300],['Медресе','31 окт',9150],['Нижняя улица','31 окт',4800]];
const NEWS = [
  ['Субботник у мечети','15 ноября, 09:00 · сбор у мечети'],
  ['Вскрытие ящиков','14 ноября, после джума · может прийти любой'],
  ['Общее собрание жителей','20 ноября, 19:00 · Дом культуры'],
  ['Нужны 6 человек на разгрузку','12 ноября, 16:00 · склад у медресе']
];

const S = {tab:'home', camp:null, month:'Октябрь 2026', d:null};
const view = document.getElementById('view');

function render(){
  document.getElementById('tabs').innerHTML = [['home','Главная'],['doc','Отчёты'],['news','Объявления']]
    .map(([id,l]) => `<button data-tab="${id}" ${S.tab===id?'aria-current="page"':''}>${ic(id)}${l}</button>`).join('');
  view.innerHTML = S.camp ? detail() : ({home, doc:reports, news})[S.tab]();
  view.scrollTop = 0;
}

const item = c => `<button class="item" data-camp="${c.id}">
  ${c.tag?`<span class="tag">${c.tag}</span>`:''}
  <div class="t"><span>${c.title}</span><em class="n">${pct(c)}%</em></div>
  <div class="bar"><i style="width:${pct(c)}%"></i></div>
  <div class="s n"><b>${rub(c.raised)}</b> из ${rub(c.goal)}</div>
</button>`;

function home(){
  return `<div class="brand">Фонд Сагасидейбук</div>
  <div class="label">Собрано в октябре</div>
  <div class="total n">351 150 ₽</div>
  <button class="btn" data-donate="">Пожертвовать</button>
  <div class="h2"><b>Сборы</b><span>${CAMPS.length}</span></div>
  ${CAMPS.map(item).join('')}
  <div class="h2"><b>Ближайшее</b><button data-tab="news" class="label">Все</button></div>
  ${NEWS.slice(0,2).map(n=>`<div class="row"><span>${n[0]}<small>${n[1]}</small></span></div>`).join('')}`;
}

function detail(){
  const c = CAMPS.find(x=>x.id===S.camp);
  return `<button class="back" data-back>${ic('back')}Назад</button>
  <h1 style="margin-bottom:12px">${c.title}</h1>
  <div class="big n">${rub(c.raised)}</div>
  <div class="label n">из ${rub(c.goal)}</div>
  <div class="bar" style="height:6px;margin-top:12px"><i style="width:${pct(c)}%"></i></div>
  <div class="facts n"><div><b>${pct(c)}%</b>собрано</div><div><b>${c.donors}</b>человек</div><div><b>${c.left}</b>срок</div></div>
  <button class="btn" data-donate="${c.id}">Пожертвовать</button>
  <p class="p">${c.text}</p>
  <div class="h2"><b>Потрачено</b></div>
  ${c.spent.map(s=>`<div class="row"><span>${s[0]}<small>${s[1]} · чек в отчёте</small></span><b class="minus n">−${rub(s[2])}</b></div>`).join('')}`;
}

function reports(){
  const r = REPORTS[S.month], k = Object.keys(REPORTS), i = k.indexOf(S.month);
  const inc = r.online + r.boxes + r.cash, out = r.out.reduce((a,o)=>a+o[2],0);
  return `<div class="brand">Фонд Сагасидейбук</div><h1>Отчёты</h1>
  <div class="month"><button data-month="${k[i+1]||''}" ${k[i+1]?'':'disabled'} aria-label="Раньше">${ic('back')}</button><b>${S.month}</b><button data-month="${k[i-1]||''}" ${k[i-1]?'':'disabled'} aria-label="Позже">${ic('next')}</button></div>
  <div class="kpis n"><div>Пришло<b class="plus">${Math.round(inc/1000)} т. ₽</b></div><div>Потрачено<b class="minus">${Math.round(out/1000)} т. ₽</b></div><div>Остаток<b>${(r.balance/1e6).toFixed(2).replace('.',',')} млн</b></div></div>
  <div class="h2"><b>Откуда</b></div>
  <div class="row"><span>Онлайн</span><b class="n">${rub(r.online)}</b></div>
  <div class="row"><span>Ящики для садаки</span><b class="n">${rub(r.boxes)}</b></div>
  <div class="row"><span>Наличными в фонд</span><b class="n">${rub(r.cash)}</b></div>
  <div class="h2"><b>Куда</b></div>
  ${r.out.map(o=>`<div class="row"><span>${o[0]}<small>${o[1]}</small></span><b class="minus n">−${rub(o[2])}</b></div>`).join('')}
  <div class="h2"><b>Ящики</b><span>последнее вскрытие</span></div>
  ${BOXES.map(b=>`<div class="row"><span>${b[0]}<small>${b[1]}</small></span><b class="n">${rub(b[2])}</b></div>`).join('')}
  <div class="note">Ящики вскрывает комиссия из 3 человек. Сумма и фото пересчёта публикуются в тот же день.</div>`;
}

function news(){
  return `<div class="brand">Фонд Сагасидейбук</div><h1>Объявления</h1>
  ${NEWS.map(n=>`<div class="row"><span>${n[0]}<small>${n[1]}</small></span></div>`).join('')}`;
}

/* donate */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openD(id){ S.d={camp:id, amt:1000, custom:'', type:'sadaka', done:false}; drawD(); scrim.classList.add('on'); sheet.classList.add('on'); }
function closeD(){ scrim.classList.remove('on'); sheet.classList.remove('on'); }
const sum = () => S.d.custom ? (parseInt(S.d.custom,10)||0) : S.d.amt;
function drawD(){
  const d = S.d, c = CAMPS.find(x=>x.id===d.camp);
  if (d.done){ sheet.innerHTML = `<div class="grab"></div><div class="ok"><div class="c">${ic('check')}</div>
    <h3>Джазакаллаху хайран</h3><p class="n">${rub(sum())} · ${c?c.title:'Куда нужнее'}<br>Это демо, оплата не проводилась</p>
    <button class="btn" data-close>Готово</button></div>`; return; }
  sheet.innerHTML = `<div class="grab"></div>
    <h3>Пожертвование</h3><div class="to">${c?c.title:'Куда нужнее всего'}</div>
    <div class="amts n">${[500,1000,3000,5000].map(a=>`<button data-amt="${a}" aria-pressed="${!d.custom&&d.amt===a}">${a.toLocaleString('ru-RU')}</button>`).join('')}</div>
    <label class="inp"><input id="amt" inputmode="numeric" placeholder="Другая сумма" value="${d.custom}" aria-label="Другая сумма"><span class="label">₽</span></label>
    <div class="seg"><button data-type="sadaka" aria-pressed="${d.type==='sadaka'}">Садака</button><button data-type="zakat" aria-pressed="${d.type==='zakat'}">Закят</button></div>
    <button class="btn n" data-pay>Оплатить через СБП · ${rub(sum())}</button>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if ('tab' in d){ S.tab=d.tab; S.camp=null; render(); }
  else if ('camp' in d){ S.camp=d.camp; render(); }
  else if ('back' in d){ S.camp=null; render(); }
  else if ('month' in d){ if(d.month){ S.month=d.month; render(); } }
  else if ('donate' in d){ openD(d.donate); }
  else if ('close' in d){ closeD(); }
  else if ('amt' in d){ S.d.amt=+d.amt; S.d.custom=''; drawD(); }
  else if ('type' in d){ S.d.type=d.type; if(d.type==='zakat') S.d.camp='need'; drawD(); }
  else if ('pay' in d){ if(sum()>0){ S.d.done=true; drawD(); } }
});
scrim.addEventListener('click', closeD);
sheet.addEventListener('input', e => {
  if (e.target.id !== 'amt') return;
  S.d.custom = e.target.value.replace(/\D/g,'').slice(0,7); e.target.value = S.d.custom;
  sheet.querySelectorAll('[data-amt]').forEach(x=>x.setAttribute('aria-pressed', !S.d.custom && +x.dataset.amt===S.d.amt));
  sheet.querySelector('[data-pay]').textContent = 'Оплатить через СБП · ' + rub(sum());
});
render();
</script>

</body>
</html>
