<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#C9A86A">
  <title>Fasad AI — нет подключения</title>
  <link rel="icon" href="favicon.ico">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #F7F4EF;
      color: #2B2620;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      text-align: center;
    }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 15px; color: #6B6258; margin: 0 0 24px; max-width: 320px; }
    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 28px;
      background: #C9A86A;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="icon-192.png" alt="" style="border-radius:22%">
    <h1>Нет подключения к интернету</h1>
    <p>Fasad AI нужен интернет, чтобы загружать фото и создавать дизайн. Проверьте соединение и попробуйте снова.</p>
    <button onclick="location.reload()">Повторить</button>
  </main>
</body>
</html>
