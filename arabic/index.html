<!DOCTYPE html>
<html lang="ru" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>عاقبة الجشع — Уроки</title>
    <link rel="stylesheet" href="style.css?v=0018">
</head>

<body class="view-welcome">
    <!-- Экран выбора урока: адрес / -->
    <section class="welcome" id="welcomeScreen">
        <button class="welcome-menu" id="welcomeMenuBtn" aria-label="Выбрать урок" title="Выбрать урок">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>
        <div class="welcome-body">
            <div class="welcome-mark">ع</div>
            <h1 class="welcome-title">Выберите урок</h1>
            <p class="welcome-subtitle">اختر الدرس</p>
        </div>
    </section>
    <div class="app" id="mainContent">
        <header class="header">
            <div class="header-side-spacer" aria-hidden="true"></div>
            <div class="header-center">
                <div class="lesson-number" id="lessonNumber">УРОК ٣</div>
                <div class="lesson-title" id="lessonTitle">عَاقِبَةُ الْجَشَعِ</div>
                <div class="lesson-title-ru" id="lessonTitleRu"></div>
            </div>
            <button class="header-menu" id="menuBtn" aria-label="Выбрать урок">
                <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
        </header>
        <main class="content">
            <div class="mode-switch" role="tablist" aria-label="Режим урока"><button class="mode-btn active"
                    id="wordsTab" role="tab" aria-selected="true">Слова</button><button class="mode-btn" id="storyTab"
                    role="tab" aria-selected="false">Текст</button></div>
            <section class="screen word-screen active" id="wordsScreen">
                <div class="word-card" id="wordCard">
                    <div class="card-count" id="topCounter">١ / ٣٣</div>
                    <div class="arabic-word" id="arabicWord"></div>
                    <button class="translation hidden-translation" id="translation" type="button" aria-label="Показать перевод"><span class="translation-text"></span></button>
                    <div class="part-of-speech" id="partOfSpeech"></div>
                    <button class="pronounce-btn" id="pronounceWord" type="button"><span class="pronounce-icon">◖</span><span>Прослушать</span></button>
                    <div class="card-nav"><button class="arrow" id="prevWord"
                            aria-label="Предыдущее слово">‹</button><button class="random"
                            id="randomWord"><span>⤨</span> Случайное слово</button><button class="arrow next"
                            id="nextWord" aria-label="Следующее слово">›</button>
                    </div>
                </div>
            </section>
            <section class="screen story-screen" id="storyScreen">
                <div class="story-card">
                    <div class="story-scroll">
                        <div class="story-text" id="storyText"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="lesson-drawer" id="lessonDrawer" aria-hidden="true">
        <div class="drawer-head">
            <div class="drawer-title">Уроки</div><button class="drawer-close" id="drawerClose"
                aria-label="Закрыть">×</button>
        </div>
        <div class="lesson-list">
            <button class="lesson-item" data-lesson="1"><strong>1</strong><span class="lesson-info"><span>عِنْدَ الْمُعَلِّمِ الْمَرِيضِ</span><small>Возле больного учителя</small></span></button><button class="lesson-item" data-lesson="2"><strong>2</strong><span class="lesson-info"><span>عِنْدَ الْمُعَلِّمِ الْمَرِيضِ</span><small>Возле больного учителя</small></span></button><button class="lesson-item" data-lesson="3"><strong>3</strong><span class="lesson-info"><span>عَاقِبَة الْجَشَعِ</span><small>Последствие жадности</small></span></button>
        <button class="lesson-item" data-lesson="4"><strong>4</strong><span class="lesson-info"><span>الرَّجُلُ وَأَوْلَادُهُ</span><small>Мужчина и его дети</small></span></button><button class="lesson-item" data-lesson="5"><strong>5</strong><span class="lesson-info"><span>المَطَرُ</span><small>Дождь</small></span></button><button class="lesson-item" data-lesson="6"><strong>6</strong><span class="lesson-info"><span>الْحَمَامَةُ وَالنَّمْلَةُ</span><small>Голубь и муравей</small></span></button><button class="lesson-item" data-lesson="7"><strong>7</strong><span class="lesson-info"><span>الْأَسَدُ</span><small>Лев</small></span></button>
        </div>
    </aside>
    <div class="word-popup" id="wordPopup">
        <div class="popup-arabic" id="popupArabic"></div>
        <div class="popup-translation" id="popupTranslation"></div>
        <div class="popup-type" id="popupType"></div><button class="popup-pronounce" id="popupPronounce" type="button">◖
            Прослушать</button>
    </div>
    <script src="app.js?v=0018"></script>
</body>

</html>
