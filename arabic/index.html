<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>عاقبة الجشع — Урок 3</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#17191d;--muted:#8c929c;--blue:#3478e5;--blue-soft:#eaf2ff;--segment:#e9eef5;--radius:28px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}button{font:inherit}
.app{width:100%;max-width:520px;height:100dvh;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding-top:env(safe-area-inset-top)}
.header{height:116px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 70px 8px;background:linear-gradient(#f7f9fc,#f2f6fb)}
.lesson-number{font-size:12px;line-height:1;font-weight:700;letter-spacing:.18em;color:#858b95;margin-bottom:8px}.lesson-title{direction:rtl;font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1.1;font-weight:700;white-space:nowrap}
.header-btn{position:absolute;top:22px;width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.82);box-shadow:0 2px 12px rgba(30,45,70,.05);display:grid;place-items:center;color:#111;font-size:29px;line-height:1}.header-back{left:16px}.header-menu{right:16px;font-size:25px;letter-spacing:2px}
.content{position:relative;flex:1;min-height:0;overflow:hidden;padding:0 18px 14px}.segmented{height:58px;flex:none;background:var(--segment);border-radius:30px;padding:5px;display:flex;direction:ltr;margin:0 0 16px;box-shadow:inset 0 1px 2px rgba(30,50,80,.03)}.segment{flex:1;border:0;border-radius:26px;background:transparent;color:#8b919b;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.18s}.segment.active{background:#fff;color:#20242a;box-shadow:0 2px 8px rgba(35,55,85,.07)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;padding:0 18px 14px}.screen.active{display:flex}.word-screen,.story-screen{min-height:0}
.word-card,.story-card{position:relative;flex:1;min-height:0;background:var(--card);border:1px solid rgba(210,216,225,.6);border-radius:var(--radius);box-shadow:0 8px 28px rgba(36,55,80,.055);overflow:hidden}.word-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:45px 25px 82px;touch-action:pan-y}
.card-count{position:absolute;top:25px;left:27px;color:#7f858e;font-size:15px;font-weight:500;direction:ltr}.favorite{position:absolute;top:19px;right:22px;width:42px;height:42px;border:0;background:transparent;color:#a2a8b1;font-size:31px;line-height:1;display:grid;place-items:center}.favorite.active{color:#f2b72d}
.arabic-word{direction:rtl;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:clamp(62px,17vw,82px);line-height:1.15;font-weight:700;min-height:1.2em}.audio{width:64px;height:64px;border:0;border-radius:50%;background:#edf4ff;color:#3979df;margin:30px 0 20px;display:grid;place-items:center;font-size:27px;box-shadow:0 3px 12px rgba(52,120,229,.08)}.translation{text-align:center;font-size:25px;line-height:1.2;font-weight:750;max-width:92%}.part-of-speech{margin-top:9px;color:#a0a5ad;font-size:15px}
.card-nav{position:absolute;bottom:18px;left:26px;right:26px;display:flex;align-items:center;justify-content:space-between}.arrow{width:52px;height:52px;border:0;border-radius:50%;background:#eef3f9;color:#111;font-size:31px;display:grid;place-items:center}.arrow.next{background:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(52,120,229,.22)}.bottom-count{color:#8b919a;font-size:16px;direction:ltr}.random{height:52px;flex:none;margin-top:16px;border:0;border-radius:26px;background:var(--blue-soft);color:#2e6fce;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}.random span{font-size:23px}
.story-scroll{height:100%;overflow:auto;scrollbar-width:none}.story-scroll::-webkit-scrollbar{display:none}.story-card{padding:27px 24px 84px;overflow:auto}.story-text{direction:rtl;text-align:right;font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.85}.story-line{display:block;margin-bottom:9px}.story-word{cursor:pointer;border-radius:7px;padding:1px 2px;transition:.15s}.story-word.selected{background:#e8f0fd;color:#1e5fb9}.story-nav{position:absolute;left:26px;right:26px;bottom:18px;display:flex;justify-content:space-between;align-items:center}.story-nav .arrow{background:#eef3f9}.story-nav .arrow.next{background:var(--blue);color:#fff}
.word-popup{position:fixed;z-index:50;left:50%;bottom:90px;width:min(320px,calc(100% - 40px));padding:16px 18px;background:#202328;color:#fff;border-radius:19px;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:.16s;box-shadow:0 10px 35px rgba(0,0,0,.22)}.word-popup.show{opacity:1;transform:translate(-50%,0)}.popup-arabic{direction:rtl;font-family:Georgia,serif;font-size:24px}.popup-translation{margin-top:5px;font-size:16px;font-weight:650}.popup-type{margin-top:4px;color:#aeb4bd;font-size:12px}
@media(max-width:380px){.header{height:104px}.lesson-title{font-size:27px}.header-btn{top:18px;width:44px;height:44px}.content{padding:0 14px 10px}.segmented{height:54px;margin-bottom:12px}.arabic-word{font-size:58px}.translation{font-size:21px}.word-card{padding-left:18px;padding-right:18px}.story-text{font-size:20px;line-height:1.72}}@media(max-height:700px){.header{height:98px}.word-card{padding-top:35px}.audio{margin:20px 0 15px}.segmented{height:52px}.random{height:48px;margin-top:10px}}
</style>
</head>
<body><div class="app">
<header class="header"><button class="header-btn header-back" id="backBtn">‹</button><div class="lesson-number">УРОК 3</div><div class="lesson-title">عَاقِبَةُ الْجَشَعِ</div><button class="header-btn header-menu" id="menuBtn">•••</button></header>
<main class="content"><div class="segmented"><button class="segment active" id="wordsTab">🧠 <span>Слова</span></button><button class="segment" id="storyTab">📖 <span>Текст</span></button></div>
<section class="screen word-screen active" id="wordsScreen"><div class="word-card" id="wordCard"><div class="card-count" id="topCounter">1 / 33</div><button class="favorite" id="favorite">☆</button><div class="arabic-word" id="arabicWord"></div><button class="audio" id="audioBtn">🔊</button><div class="translation" id="translation"></div><div class="part-of-speech" id="partOfSpeech"></div><div class="card-nav"><button class="arrow" id="prevWord">‹</button><div class="bottom-count" id="wordCounter">1 / 33</div><button class="arrow next" id="nextWord">›</button></div></div><button class="random" id="randomWord"><span>⤨</span> Случайное слово</button></section>
<section class="screen story-screen" id="storyScreen"><div class="story-card"><div class="story-scroll"><div class="story-text" id="storyText"></div></div><div class="story-nav"><button class="arrow" id="storyPrev">‹</button><div class="bottom-count">Текст</div><button class="arrow next" id="storyNext">›</button></div></div></section></main>
<div class="word-popup" id="wordPopup"><div class="popup-arabic" id="popupArabic"></div><div class="popup-translation" id="popupTranslation"></div><div class="popup-type" id="popupType"></div></div></div>
<script>
const words=[['خَرَجَ','вышел / отправился','глагол'],['غَابَة','лес','существительное'],['صَيَّاد','охотник','существительное'],['قَوْس','лук','существительное'],['سَهْم','стрела','существительное'],['جُرْح','рана','существительное'],['بَلِيغ','глубокий / тяжёлый','прилагательное'],['بُرْهَة','короткий промежуток времени','существительное'],['خِنْزِير','кабан','существительное'],['فَرِحَ','обрадовался','глагол'],['رَمَى','бросил / метнул','глагол'],['قَتَلَ','убил','глагол'],['رَأَى','увидел','глагол'],['أَبْصَرَ','увидел / заметил','глагол'],['حَمَلَ','понёс','глагол'],['تَوَجَّهَ','направился','глагол'],['وَسَط','середина','существительное'],['طَرِيق','дорога','существительное'],['أَرْض','земля','существительное'],['ضَرَبَ','ударил','глагол'],['وَقَعَ','упал','глагол'],['ذِئْب','волк','существительное'],['مَكَان','место','существительное'],['زَمَن','время','существительное'],['شَهْر','месяц','существительное'],['يَوْم','день','существительное'],['قَرِيب','близкий','прилагательное'],['جَشَع','жадность','существительное'],['عَاقِبَة','последствие','существительное'],['سُرُور','радость','существительное'],['قُوت','пища / пропитание','существительное'],['يَزِيدُ','увеличивается / становится больше','глагол'],['أَكَلَ','ел','глагол']].map(([arabic,translation,type])=>({arabic,translation,type}));
const story=[
[['يُحْكَى','рассказывают / повествуется','глагол'],['أَنَّ','что','частица'],['صَيَّادًا','охотник','существительное'],['خَرَجَ','вышел / отправился','глагол'],['يَوْمًا','однажды','наречие'],['إِلَى غَابَةٍ','в лес','существительное'],['لِلصَّيْدِ','для охоты','существительное'],['وَمَعَهُ','и с ним','союз + местоимение'],['قَوْسُهُ','его лук','существительное'],['وَسِهَامُهُ','и его стрелы','существительное']],
[['فَلَمْ يَجَاوِزْ','он не прошёл','глагол'],['غَيْرَ بَعِيدٍ','далеко','наречие'],['حَتَّى رَأَى','пока не увидел','глагол'],['ظَبْيًا','оленя','существительное']],
[['رَمَاهُ','бросил / метнул','глагол'],['بِسَهْمٍ','стрелой','существительное'],['فَقَتَلَهُ','и убил его','глагол'],['فِي مَكَانِهِ','на его месте','существительное']],
[['فَسَرَّ','обрадовался','глагол'],['الصَّيَّادُ','охотник','существительное'],['بِذَلِكَ','этим','местоимение'],['سُرُورًا عَظِيمًا','сильной радостью','существительное'],['وَحَمَلَهُ','понёс его','глагол'],['وَتَوَجَّهَ','и направился','глагол'],['إِلَى قَرِيبَتِهِ','к своим близким','существительное']],
[['وَفِيمَا','и когда','союз'],['هُوَ','он был','глагол'],['فِي وَسَطِ','посреди','существительное'],['الطَّرِيقِ','дороги','существительное'],['إِذْ أَبْصَرَ','увидел','глагол'],['خِنْزِيرًا بَرِّيًّا','дикого кабана','существительное'],['مُقْبِلًا عَلَيْهِ','идущего навстречу','глагол']],
[['فَأَلْقَى','бросил','глагол'],['الطَّبِيُّ','лук','существительное'],['إِلَى الْأَرْضِ','на землю','существительное'],['وَرَمَاهُ','и бросил в него','глагол'],['بِسَهْمٍ','стрелой','существительное'],['فَنَفَذَ فِيهِ','пронзила его','глагол'],['وَجَرَحَهُ جُرْحًا بَلِيغًا','и нанес ему тяжёлую рану','глагол']],
[['فَهَجَمَ عَلَيْهِ','напал на него','глагол'],['الْخِنْزِيرُ','кабан','существительное'],['بِغَيْظٍ','с яростью','существительное'],['وَحَقَّ','и убил','глагол'],['بِأَنْيَابِهِ','своими клыками','существительное']],
[['وَضَرَبَهُ','ударил его','глагол'],['ضَرْبَةً','одним ударом','существительное'],['أَطَارَتْ','отбросил','глагол'],['مِنْ يَدِهِ','из его руки','существительное'],['الْقَوْسَ','лук','существительное'],['وَوَقَعَا مَيِّتَيْنِ','и оба упали мёртвыми','глагол']],
[['وَبَعْدَ بُرْهَةٍ مِنَ الزَّمَنِ','через некоторое время','существительное'],['أَتَى','пришёл','глагол'],['ذِئْبٌ','волк','существительное'],['إِلَى هَذَا الْمَكَانِ','к этому месту','существительное'],['فَطَارَ فَرَحًا','и обрадовался','глагол'],['بِمَا رَأَى','тому, что увидел','глагол']],
[['وَقَالَ','и сказал','глагол'],['هَذَا الرَّجُلُ','этот человек','существительное'],['وَالْخِنْزِيرُ','и кабан','существительное'],['تَكُونُ قُوتًا لِي','будут пищей для меня','существительное'],['مُدَّةَ شَهْرٍ أَوْ يَزِيدُ','на месяц или больше','существительное']],
[['فَآكُلُ','я буду есть','глагол'],['الْيَوْمَ','сегодня','наречие'],['هَذَا الْوَتَرَ','этот лук','существительное'],['وَآخِرَ الْبَاقِي','а остальное','существительное'],['إِلَى غَدٍ','оставлю на завтра','глагол']],
[['ثُمَّ','затем','наречие'],['إِنَّهُ أَخَذَ','он взял','глагол'],['فَعَالَجَهُ','и натянул','глагол'],['حَتَّى قَطَعَهُ','пока не перерезал','глагол']],
[['فَلَمَّا انْقَطَعَتْ','когда оборвалась','глагол'],['سِيَةُ الْقَوْسِ','тетива лука','существительное'],['ضَرَبَتْ','он ударил','глагол'],['حَلْقَهُ','его шею','существительное'],['فَمَاتَ','и он умер','глагол']]
];
let current=0,favorite=false,touchX=0;const $=id=>document.getElementById(id);
function renderWord(){const w=words[current];$('arabicWord').textContent=w.arabic;$('translation').textContent=w.translation;$('partOfSpeech').textContent=w.type;const n=`${current+1} / ${words.length}`;$('topCounter').textContent=n;$('wordCounter').textContent=n;$('favorite').textContent=favorite?'★':'☆';$('favorite').classList.toggle('active',favorite)}
function next(){current=(current+1)%words.length;favorite=false;renderWord()}function prev(){current=(current-1+words.length)%words.length;favorite=false;renderWord()}function random(){let n;do n=Math.floor(Math.random()*words.length);while(words.length>1&&n===current);current=n;favorite=false;renderWord()}
$('nextWord').onclick=next;$('prevWord').onclick=prev;$('randomWord').onclick=random;$('favorite').onclick=()=>{favorite=!favorite;renderWord()};$('audioBtn').onclick=()=>{const u=new SpeechSynthesisUtterance(words[current].arabic);u.lang='ar-SA';u.rate=.78;speechSynthesis.cancel();speechSynthesis.speak(u)};
$('wordCard').addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});$('wordCard').addEventListener('touchend',e=>{const d=touchX-e.changedTouches[0].screenX;if(Math.abs(d)>50)(d>0?next:prev)()},{passive:true});
function show(screen){$('wordsScreen').classList.toggle('active',screen==='words');$('storyScreen').classList.toggle('active',screen==='story');$('wordsTab').classList.toggle('active',screen==='words');$('storyTab').classList.toggle('active',screen==='story');closePopup()}$('wordsTab').onclick=()=>show('words');$('storyTab').onclick=()=>show('story');
function renderStory(){const root=$('storyText');root.replaceChildren();story.forEach(line=>{const div=document.createElement('div');div.className='story-line';line.forEach(([ar,ru,type],i)=>{const s=document.createElement('span');s.className='story-word';s.textContent=ar;s.dataset.translation=ru;s.dataset.type=type;s.onclick=e=>{e.stopPropagation();document.querySelectorAll('.story-word.selected').forEach(x=>x.classList.remove('selected'));s.classList.add('selected');$('popupArabic').textContent=ar;$('popupTranslation').textContent=ru;$('popupType').textContent=type;$('wordPopup').classList.add('show')};div.appendChild(s);if(i<line.length-1)div.append(' ')});root.appendChild(div)})}
function closePopup(){$('wordPopup').classList.remove('show');document.querySelectorAll('.story-word.selected').forEach(x=>x.classList.remove('selected'))}document.addEventListener('click',e=>{if(!e.target.closest('.story-word')&&!e.target.closest('.word-popup'))closePopup()});$('storyPrev').onclick=()=>{};$('storyNext').onclick=()=>{};$('backBtn').onclick=()=>{if(history.length>1)history.back()};$('menuBtn').onclick=()=>alert('Урок 3');renderWord();renderStory();
</script></body></html>
