<!DOCTYPE html>
<html lang="ru" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="description" content="Уроки арабского языка: карточки слов с переводом и тексты рассказов.">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="application-name" content="Arabic">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Arabic">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Arabic">
    <meta property="og:description" content="Уроки арабского языка: карточки слов с переводом и тексты рассказов.">
    <meta property="og:image" content="icons/icon-512.png">
    <title>Arabic</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css?v=0026">
</head>

<body class="view-welcome">
    <!-- Заставка: только при запуске с экрана «Домой» (или с ?splash для проверки) -->
    <div class="splash" id="splash" aria-hidden="true">
        <div class="splash-tile"><img class="splash-glyph" src="icons/glyph.png" alt=""></div>
        <div class="splash-name">Arabic</div>
        <div class="splash-sub">Уроки арабского языка</div>
    </div>
    <script>
        (function () {
            var s = document.getElementById("splash");
            var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
            var forced = /[?&]splash\b/.test(location.search);
            var seen = false;
            try {
                seen = sessionStorage.getItem("arabic.splash") === "1";
                sessionStorage.setItem("arabic.splash", "1");
            } catch (e) {}
            if (forced || (standalone && !seen)) document.documentElement.classList.add("splash-on");
            else s.remove();
        })();
    </script>
    <!-- Экран выбора урока: адрес / -->
    <section class="welcome" id="welcomeScreen">
        <header class="welcome-head">
            <div>
                <div class="eyebrow">Арабский язык</div>
                <h1 class="welcome-title">Уроки</h1>
            </div>
            <div class="welcome-ar" lang="ar" dir="rtl">الدُّرُوسُ</div>
        </header>
        <nav class="lesson-list" id="lessonList" aria-label="Список уроков"></nav>
    </section>

    <!-- Экран урока: адрес #lesson-N -->
    <div class="app" id="mainContent">
        <div class="navbar">
            <a class="back" id="backBtn" href="#">
                <svg width="11" height="18" viewBox="0 0 11 18" aria-hidden="true">
                    <path d="M9 2L2 9l7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Уроки
            </a>
            <span class="eyebrow" id="lessonNumber"></span>
            <div class="navbar-side">
                <button class="aa-btn" id="sizeBtn" type="button" aria-label="Размер текста" aria-expanded="false">
                    <span class="aa-small">A</span><span class="aa-big">a</span>
                </button>
            </div>
        </div>

        <div class="lesson-head">
            <div class="lesson-title" id="lessonTitle" lang="ar" dir="rtl"></div>
            <div class="lesson-title-ru" id="lessonTitleRu"></div>
        </div>

        <div class="segmented" role="tablist" aria-label="Режим урока">
            <button class="segment active" id="wordsTab" role="tab" aria-selected="true">Слова</button>
            <button class="segment" id="storyTab" role="tab" aria-selected="false">Текст</button>
        </div>

        <section class="screen word-screen active" id="wordsScreen">
            <div class="chips" id="filterChips" role="tablist" aria-label="Какие карточки показывать"></div>
            <div class="word-card" id="wordCard">
                <div class="card-top">
                    <div class="card-meta">
                        <span id="topCounter"></span>
                        <span><span id="partOfSpeech"></span><span class="learned-mark" id="learnedMark" hidden> · выучено</span></span>
                    </div>
                    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
                </div>

                <button class="card-face" id="cardFace" type="button" aria-label="Показать перевод">
                    <span class="arabic-word" id="arabicWord" lang="ar" dir="rtl"></span>
                    <span class="translation" id="translation">
                        <span class="translation-main" id="translationMain"></span>
                        <span class="translation-rest" id="translationRest"></span>
                    </span>
                    <span class="reveal-hint">Нажмите, чтобы показать перевод</span>
                </button>

                <div class="grade-nav">
                    <button class="grade-btn no" id="gradeNo" type="button">Не знаю</button>
                    <button class="grade-btn yes" id="gradeYes" type="button">Знаю</button>
                </div>

                <div class="empty-state" id="emptyState">
                    <div class="empty-title" id="emptyTitle">Все слова выучены</div>
                    <div class="empty-text" id="emptyText"></div>
                    <div class="empty-actions">
                        <button class="pill-btn" id="emptyAll" type="button">Показать все</button>
                        <button class="pill-btn primary" id="emptyReset" type="button">Учить заново</button>
                    </div>
                </div>

                <div class="card-nav">
                    <button class="round-btn" id="prevWord" type="button" aria-label="Предыдущее слово">
                        <svg width="11" height="18" viewBox="0 0 11 18" aria-hidden="true">
                            <path d="M9 2L2 9l7 7" fill="none" stroke="currentColor" stroke-width="2.4"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                    <button class="round-btn random" id="randomWord" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        Случайное
                    </button>
                    <button class="round-btn next" id="nextWord" type="button" aria-label="Следующее слово">
                        <svg width="11" height="18" viewBox="0 0 11 18" aria-hidden="true">
                            <path d="M2 2l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <section class="screen story-screen" id="storyScreen">
            <div class="story-card">
                <div class="story-text" id="storyText" lang="ar" dir="rtl"></div>
            </div>
        </section>

        <!-- Размер текста рассказа -->
        <div class="size-popover" id="sizePopover" role="dialog" aria-label="Размер текста" hidden>
            <div class="eyebrow">Размер текста</div>
            <div class="size-stepper">
                <button class="size-btn" id="sizeDown" type="button" aria-label="Уменьшить текст">A</button>
                <div class="size-dots" id="sizeDots" aria-hidden="true"></div>
                <button class="size-btn big" id="sizeUp" type="button" aria-label="Увеличить текст">A</button>
            </div>
            <div class="size-label" id="sizeLabel"></div>
            <div class="switch-row">
                <span class="switch-label" id="harakatLabel">Огласовки<small>Знаки над и под буквами</small></span>
                <button class="switch" id="harakatSwitch" type="button" role="switch" aria-checked="true"
                    aria-labelledby="harakatLabel"></button>
            </div>
        </div>
    </div>

    <!-- Перевод слова из рассказа -->
    <button class="sheet-overlay" id="sheetOverlay" type="button" aria-label="Закрыть перевод" hidden></button>
    <div class="word-sheet" id="wordSheet" role="dialog" aria-label="Перевод слова" aria-hidden="true">
        <div class="sheet-grabber" aria-hidden="true"></div>
        <div class="sheet-head">
            <div class="sheet-info">
                <div class="sheet-translation" id="popupTranslation"></div>
                <div class="pill" id="popupType"></div>
            </div>
            <div class="sheet-arabic" id="popupArabic" lang="ar" dir="rtl"></div>
        </div>
        <div class="sheet-dict" id="popupDictBlock">
            <div class="eyebrow">Словарная форма</div>
            <div class="sheet-dict-row">
                <span class="sheet-dict-word" id="popupDictWord" lang="ar" dir="rtl"></span>
                <span class="sheet-dict-text" id="popupDictText"></span>
            </div>
        </div>
        <div class="sheet-sentence" id="sentenceBlock">
            <button class="sentence-toggle" id="sentenceToggle" type="button" aria-expanded="false">Перевод предложения</button>
            <div class="sentence-text" id="sentenceText" hidden></div>
        </div>
    </div>

    <script src="app.js?v=0026"></script>
</body>

</html>
