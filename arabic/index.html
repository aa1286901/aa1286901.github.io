<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>عاقبة الجشع — Урок 3</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#17191d;--muted:#8c929c;--blue:#3478e5;--blue-soft:#eaf2ff;--radius:28px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
button{font:inherit}
.app{width:100%;max-width:520px;height:100dvh;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding-top:env(safe-area-inset-top)}
.header{height:112px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 70px 8px;background:linear-gradient(#f7f9fc,#f2f6fb)}
.lesson-number{font-size:11px;line-height:1;font-weight:700;letter-spacing:.16em;color:#858b95;margin-bottom:7px}
.lesson-title{direction:rtl;font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.15;font-weight:700;white-space:nowrap}
.header-menu{position:absolute;top:20px;right:16px;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.86);box-shadow:0 2px 12px rgba(30,45,70,.05);display:grid;place-items:center;color:#111;font-size:22px;letter-spacing:2px;line-height:1}
.content{position:relative;flex:1;min-height:0;overflow:hidden;padding:0 18px 14px}
.mode-switch{position:absolute;z-index:10;top:0;left:18px;right:18px;height:48px;padding:4px;background:#e9eef5;border-radius:16px;display:grid;grid-template-columns:1fr 1fr;box-shadow:inset 0 1px 2px rgba(20,35,55,.04)}
.mode-btn{border:0;border-radius:12px;background:transparent;color:#858b95;font-size:15px;font-weight:650;transition:.18s}
.mode-btn.active{background:#fff;color:#20242a;box-shadow:0 2px 8px rgba(30,45,70,.08)}
.screen{position:absolute;top:62px;left:0;right:0;bottom:0;display:none;flex-direction:column;overflow:hidden;padding:0 18px 14px}
.screen.active{display:flex}.word-screen,.story-screen{min-height:0}
.word-card,.story-card{position:relative;flex:1;min-height:0;background:var(--card);border:1px solid rgba(210,216,225,.6);border-radius:var(--radius);box-shadow:0 8px 28px rgba(36,55,80,.055);overflow:hidden}
.word-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:45px 25px 82px;touch-action:pan-y}
.card-count{position:absolute;top:25px;left:27px;color:#7f858e;font-size:15px;font-weight:500;direction:ltr}
.arabic-word{direction:rtl;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:clamp(62px,17vw,82px);line-height:1.15;font-weight:700;min-height:1.2em}
.translation{text-align:center;font-size:25px;line-height:1.2;font-weight:750;max-width:92%;margin-top:18px}
.part-of-speech{margin-top:8px;color:#a0a5ad;font-size:15px}
.card-nav{position:absolute;bottom:18px;left:26px;right:26px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.arrow,.random{height:48px;padding:0;border:0;border-radius:14px;display:grid;place-items:center;transition:.18s;box-shadow:0 1px 4px rgba(30,45,70,.03)}
.arrow{width:64px;flex:none;background:#e9eef5;color:#20242a;font-size:34px;font-weight:300;line-height:1;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.arrow.next{background:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(52,120,229,.22)}
.random{flex:1;min-width:0;margin:0;background:var(--blue-soft);color:#2e6fce;font-weight:600;font-size:16px;gap:8px;white-space:nowrap}.random span{font-size:22px}
.story-scroll{height:100%;overflow:auto;scrollbar-width:none}.story-scroll::-webkit-scrollbar{display:none}
.story-card{padding:27px 24px;overflow:hidden}.story-text{direction:rtl;text-align:right;font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.85}.story-line{display:block;margin-bottom:9px}
.story-word{cursor:pointer;border-radius:7px;padding:1px 2px;transition:.15s}.story-word.selected{background:#e8f0fd;color:#1e5fb9}
.word-popup{position:fixed;z-index:50;left:50%;bottom:90px;width:min(320px,calc(100% - 40px));padding:16px 18px;background:#202328;color:#fff;border-radius:19px;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:.16s;box-shadow:0 10px 35px rgba(0,0,0,.22)}
.word-popup.show{opacity:1;transform:translate(-50%,0)}.popup-arabic{direction:rtl;font-family:Georgia,serif;font-size:24px}.popup-translation{margin-top:5px;font-size:16px;font-weight:650}.popup-type{margin-top:4px;color:#aeb4bd;font-size:12px}
@media(max-width:380px){.header{height:104px}.lesson-title{font-size:22px}.header-menu{top:18px;width:44px;height:44px}.content{padding:0 14px 10px}.mode-switch{left:14px;right:14px}.screen{padding-left:14px;padding-right:14px}.arabic-word{font-size:58px}.translation{font-size:21px}.word-card{padding-left:18px;padding-right:18px}.card-nav{left:18px;right:18px;gap:8px}.arrow{width:58px;height:46px;border-radius:13px}.random{height:46px;font-size:14px;border-radius:13px}.story-text{font-size:20px;line-height:1.72}}
@media(max-height:700px){.header{height:96px}.word-card{padding-top:35px}.card-nav{bottom:14px}}
</style>
</head>
<body><div class="app">
<header class="header"><div class="lesson-number">УРОК 3</div><div class="lesson-title">عَاقِبَةُ الْجَشَعِ</div><button class="header-menu" id="menuBtn" aria-label="Выбрать урок">•••</button></header>
<main class="content">
<div class="mode-switch" role="tablist" aria-label="Режим урока"><button class="mode-btn active" id="wordsTab" role="tab" aria-selected="true">Слова</button><button class="mode-btn" id="storyTab" role="tab" aria-selected="false">Текст</button></div>
<section class="screen word-screen active" id="wordsScreen"><div class="word-card" id="wordCard"><div class="card-count" id="topCounter">١ / ٣٣</div><div class="arabic-word" id="arabicWord"></div><div class="translation" id="translation"></div><div class="part-of-speech" id="partOfSpeech"></div><div class="card-nav"><button class="arrow" id="prevWord" aria-label="Предыдущее слово">‹</button><button class="random" id="randomWord"><span>⤨</span> Случайное слово</button><button class="arrow next" id="nextWord" aria-label="Следующее слово">›</button></div></div></section>
<section class="screen story-screen" id="storyScreen"><div class="story-card"><div class="story-scroll"><div class="story-text" id="storyText"></div></div></div></section></main>
<div class="word-popup" id="wordPopup"><div class="popup-arabic" id="popupArabic"></div><div class="popup-translation" id="popupTranslation"></div><div class="popup-type" id="popupType"></div></div></div>
<script>
const words=[['خَرَجَ','вышел / отправился','глагол'],['غَابَة','лес','существительное'],['صَيَّاد','охотник','существительное'],['قَوْس','лук','существительное'],['سَهْم','стрела','существительное'],['جُرْح','рана','существительное'],['بَلِيغ','глубокий / тяжёлый','прилагательное'],['بُرْهَة','короткий промежуток времени','существительное'],['خِنْزِير','кабан','существительное'],['فَرِحَ','обрадовался','глагол'],['رَمَى','бросил / метнул','глагол'],['قَتَلَ','убил','глагол'],['رَأَى','увидел','глагол'],['أَبْصَرَ','увидел / заметил','глагол'],['حَمَلَ','понёс','глагол'],['تَوَجَّهَ','направился','глагол'],['وَسَط','середина','существительное'],['طَرِيق','дорога','существительное'],['أَرْض','земля','существительное'],['ضَرَبَ','ударил','глагол'],['وَقَعَ','упал','глагол'],['ذِئْب','волк','существительное'],['مَكَان','место','существительное'],['زَمَن','время','существительное'],['شَهْر','месяц','существительное'],['يَوْم','день','существительное'],['قَرِيب','близкий','прилагательное'],['جَشَع','жадность','существительное'],['عَاقِبَة','последствие','существительное'],['سُرُور','радость','существительное'],['قُوت','пища / пропитание','существительное'],['يَزِيدُ','увеличивается / становится больше','глагол'],['أَكَلَ','ел','глагол']].map(([arabic,translation,type])=>({arabic,translation,type}));
const story=[[['يُحْكَى','рассказывают / повествуется','глагол'],['أَنَّ','что','частица'],['صَيَّادًا','охотник','существительное'],['خَرَجَ','вышел / отправился','глагол'],['يَوْمًا','однажды','наречие'],['إِلَى غَابَةٍ','в лес','существительное'],['لِلصَّيْدِ','для охоты','существительное'],['وَمَعَهُ','и с ним','союз + местоимение'],['قَوْسُهُ','его лук','существительное'],['وَسِهَامُهُ','и его стрелы','существительное']],[['فَلَمْ يَجَاوِزْ','он не прошёл','глагол'],['غَيْرَ بَعِيدٍ','далеко','наречие'],['حَتَّى رَأَى','пока не увидел','глагол'],['ظَبْيًا','оленя','существительное']],[['رَمَاهُ','бросил / метнул','глагол'],['بِسَهْمٍ','стрелой','существительное'],['فَقَتَلَهُ','и убил его','глагол'],['فِي مَكَانِهِ','на его месте','существительное']],[['فَسُرَّ','обрадовался','глагол'],['الصَّيَّادُ','охотник','существительное'],['بِذَلِكَ','этим','местоимение'],['سُرُورًا عَظِيمًا','сильной радостью','существительное'],['وَحَمَلَهُ','понёс его','глагол'],['وَتَوَجَّهَ','и направился','глагол'],['إِلَى قَرْيَتِهِ','к своей деревне','существительное']],[['وَفِيمَا','и когда','союз'],['هُوَ','он был','глагол'],['فِي وَسَطِ','посреди','существительное'],['الطَّرِيقِ','дороги','существительное'],['إِذْ أَبْصَرَ','увидел','глагол'],['خِنْزِيرًا بَرِّيًّا','дикого кабана','существительное'],['مُقْبِلًا عَلَيْهِ','идущего навстречу','глагол']],[['فَأَلْقَى الظَّبْيَ','бросил оленя','глагол'],['إِلَى الْأَرْضِ','на землю','существительное'],['وَصَوَّبَ عَلَيْهِ قَوْسَهُ','направил на него свой лук','глагол'],['وَرَمَاهُ','и бросил в него','глагол'],['بِسَهْمٍ','стрелой','существительное'],['فَنَفَذَ فِيهِ','пронзила его','глагол'],['وَجَرَحَهُ جُرْحًا بَلِيغًا','и нанес ему тяжёлую рану','глагол']],[['فَهَجَمَ عَلَيْهِ','напал на него','глагол'],['الْخِنْزِيرُ','кабан','существительное'],['بِغَيْظٍ وَحَنَقٍ زَائِدَيْنِ','с сильной яростью','существительное'],['وَضَرَبَهُ','и ударил его','глагол'],['بِأَنْيَابِهِ','своими клыками','существительное'],['ضَرْبَةً','ударом','существительное'],['أَطَارَتْ مِنْ يَدِهِ الْقَوْسَ','выбившим лук из его руки','глагол'],['وَوَقَعَا مَيِّتَيْنِ','и оба упали мёртвыми','глагол']],[['وَبَعْدَ بُرْهَةٍ مِنَ الزَّمَنِ','через некоторое время','существительное'],['أَتَى','пришёл','глагол'],['ذِئْبٌ','волк','существительное'],['إِلَى هَذَا الْمَكَانِ','к этому месту','существительное'],['فَطَارَ فَرَحًا','и обрадовался','глагол'],['بِمَا رَأَى','тому, что увидел','глагол']],[['وَقَالَ','и сказал','глагол'],['هَذَا الرَّجُلُ وَالظَّبْيُ وَالْخِنْزِيرُ','этот человек, олень и кабан','существительное'],['تَكُونُ قُوتًا لِي','будут мне пищей','глагол'],['مُدَّةَ شَهْرٍ أَوْ يَزِيدُ','на месяц или больше','существительное']],[['فَآكُلُ الْيَوْمَ','сегодня я съем','глагол'],['هَذَا الْوَتَرَ','эту тетиву','существительное'],['وَأَدَّخِرُ الْبَاقِيَ','а остальное сохраню','глагол'],['إِلَى غَدٍ فَمَا وَرَاءَهُ','на завтра и последующие дни','существительное']],[['ثُمَّ إِنَّهُ','затем он','союз + местоимение'],['أَخَذَ يَقْطَعُ الْوَتَرَ','начал перерезать тетиву','глагол'],['فَعَالَجَهُ','и стал работать с ней','глагол'],['حَتَّى قَطَعَهُ','пока не перерезал её','глагол']],[['فَلَمَّا انْقَطَعَ','когда она оборвалась','глагол'],['طَارَتْ سِيَةُ الْقَوْسِ','конец лука отлетел','глагол'],['فَضَرَبَتْ حَلْقَهُ','и ударил его в горло','глагол'],['فَمَاتَ','и он умер','глагол']]];
const arDigits=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);let current=0;const $=id=>document.getElementById(id);
function renderWord(){const w=words[current];$('arabicWord').textContent=w.arabic;$('translation').textContent=w.translation;$('partOfSpeech').textContent=w.type;const n=`${arDigits(current+1)} / ${arDigits(words.length)}`;$('topCounter').textContent=n}
function renderStory(){$('storyText').innerHTML=story.map(line=>`<span class="story-line">${line.map(([arabic,translation,type])=>`<span class="story-word" data-arabic="${arabic.replace(/"/g,'&quot;')}" data-translation="${translation.replace(/"/g,'&quot;')}" data-type="${type.replace(/"/g,'&quot;')}">${arabic}</span>`).join(' ')}</span>`).join('')}
function showWord(i){current=(i+words.length)%words.length;renderWord()}
function setMode(mode){const wordsMode=mode==='words';$('wordsScreen').classList.toggle('active',wordsMode);$('storyScreen').classList.toggle('active',!wordsMode);$('wordsTab').classList.toggle('active',wordsMode);$('storyTab').classList.toggle('active',!wordsMode);$('wordsTab').setAttribute('aria-selected',wordsMode);$('storyTab').setAttribute('aria-selected',!wordsMode)}
$('prevWord').onclick=()=>showWord(current-1);$('nextWord').onclick=()=>showWord(current+1);$('randomWord').onclick=()=>{let n;do n=Math.floor(Math.random()*words.length);while(n===current&&words.length>1);showWord(n)};
$('wordsTab').onclick=()=>setMode('words');$('storyTab').onclick=()=>setMode('story');$('menuBtn').onclick=()=>alert('Выбор урока');
$('storyText').addEventListener('click',e=>{const el=e.target.closest('.story-word');if(!el)return;document.querySelectorAll('.story-word.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');$('popupArabic').textContent=el.dataset.arabic;$('popupTranslation').textContent=el.dataset.translation;$('popupType').textContent=el.dataset.type;$('wordPopup').classList.add('show');clearTimeout(window.popupTimer);window.popupTimer=setTimeout(()=>$('wordPopup').classList.remove('show'),2200)});
let startX=0;$('wordCard').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});$('wordCard').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45)showWord(current+(dx<0?1:-1))},{passive:true});
renderWord();renderStory();
</script></div></body></html>
